name: video-streaming-service

# Settings the migration job, the web app and the worker all need.
x-app-env: &app-env
  DATABASE_URL: postgres://videos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/videos
  S3_ENDPOINT: http://garage:3900
  S3_REGION: garage
  S3_BUCKET: videos
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}

# Resource limits are sized for a 6-core, 12 GB server shared with other
# projects. The worker's CPU limit is the one that matters: ffmpeg takes every
# core it is given, and this keeps the site responsive while it transcodes.
# A container that goes over its memory limit is killed and restarted.
services:
  postgres:
    image: postgres:18.7
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    environment:
      POSTGRES_USER: videos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: videos
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U videos -d videos']
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.5.0
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Prepares Garage on every deploy: storage role, bucket and the app's access
  # key. It only changes anything the first time; after that each step is skipped.
  garage-init:
    image: ghcr.io/andreferrazz/video-streaming-service-worker:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: ['node', '../shared/src/garage-init.ts']
    restart: 'no'
    environment:
      <<: *app-env
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
      # Disk space Garage may use, in gigabytes. Read only on the first deploy.
      GARAGE_CAPACITY_GB: ${GARAGE_CAPACITY_GB:-100}
      # The most the bucket may hold, in gigabytes. Garage refuses uploads past
      # it, so video can never fill the server's disk. Applied on every deploy.
      GARAGE_MAX_SIZE_GB: ${GARAGE_MAX_SIZE_GB:-10}
    depends_on:
      garage:
        condition: service_started

  # Runs once per deploy and exits; the apps wait for it to succeed.
  migrate:
    image: ghcr.io/andreferrazz/video-streaming-service-worker:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: ['node', '../shared/src/db/migrate.ts']
    restart: 'no'
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    image: ghcr.io/andreferrazz/video-streaming-service-webapp:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
    restart: unless-stopped
    environment:
      <<: *app-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # The public address of the site, e.g. https://videos.example.com. Forms are rejected without it.
      ORIGIN: ${ORIGIN:?set ORIGIN}
      # Uploads are streamed straight to storage, so the default 512 KB cap must go.
      BODY_SIZE_LIMIT: Infinity
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/andreferrazz/video-streaming-service-worker:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  garage-meta:
  garage-data:
