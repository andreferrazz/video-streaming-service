name: video-streaming-service

# Settings the migration job, the web app and the worker all need.
#
# Storage defaults to the Garage in this file. To use any other S3-compatible
# storage, set EXTERNAL_S3_ENDPOINT (and the other EXTERNAL_S3_* values it needs)
# together with GARAGE_REPLICAS=0. See docs/storage.md.
x-app-env: &app-env
  DATABASE_URL: postgres://videos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/videos
  S3_ENDPOINT: ${EXTERNAL_S3_ENDPOINT:-http://garage:3900}
  S3_REGION: ${EXTERNAL_S3_REGION:-garage}
  S3_BUCKET: ${EXTERNAL_S3_BUCKET:-videos}
  S3_FORCE_PATH_STYLE: ${EXTERNAL_S3_FORCE_PATH_STYLE:-true}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  # The most all videos together may hold, in gigabytes. The apps keep count and
  # refuse uploads past it, so video can never fill the server's disk.
  STORAGE_LIMIT_GB: ${STORAGE_LIMIT_GB:-10}
  # Hours without activity before an unfinished upload is discarded.
  UPLOAD_EXPIRY_HOURS: ${UPLOAD_EXPIRY_HOURS:-24}

# Resource limits are sized for a 6-core, 12 GB server shared with other
# projects. The worker's CPU limit is the one that matters: ffmpeg takes every
# core it is given, and this keeps the site responsive while it transcodes.
# A container that goes over its memory limit is killed and restarted.
services:
  postgres:
    image: postgres:18.7
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    environment:
      POSTGRES_USER: videos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: videos
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U videos -d videos']
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.5.0
    deploy:
      # Set GARAGE_REPLICAS=0 to not run Garage at all, when storage is external.
      replicas: ${GARAGE_REPLICAS:-1}
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    environment:
      # Not marked as required here, because they are unused with external storage.
      # Garage refuses to start without them, so a missing value still fails loudly.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Prepares Garage on every deploy: storage role, bucket and the app's access
  # key. It only changes anything the first time; after that each step is skipped.
  # With external storage it has nothing to do and exits straight away.
  garage-init:
    image: ghcr.io/andreferrazz/video-streaming-service-worker:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: ['node', '../shared/src/garage-init.ts']
    restart: 'no'
    environment:
      <<: *app-env
      EXTERNAL_S3_ENDPOINT: ${EXTERNAL_S3_ENDPOINT:-}
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      # Disk space Garage may use, in gigabytes. Read only on the first deploy.
      GARAGE_CAPACITY_GB: ${GARAGE_CAPACITY_GB:-100}

  # Runs once per deploy and exits; the apps wait for it to succeed.
  migrate:
    image: ghcr.io/andreferrazz/video-streaming-service-worker:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: ['node', '../shared/src/db/migrate.ts']
    restart: 'no'
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    image: ghcr.io/andreferrazz/video-streaming-service-webapp:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
    restart: unless-stopped
    environment:
      <<: *app-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # The public address of the site, e.g. https://videos.example.com. Forms are
      # rejected without it, and its pages are the ones allowed to upload to storage.
      ORIGIN: ${ORIGIN:?set ORIGIN}
      # The address browsers use to reach storage: uploads go there directly. With
      # the bundled Garage it is the hostname given to the garage service, e.g.
      # https://storage.example.com. With external storage it is that storage's own
      # address, so STORAGE_PUBLIC_URL can be left unset.
      S3_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_URL:-${EXTERNAL_S3_ENDPOINT:?set STORAGE_PUBLIC_URL}}
      # The largest single file accepted, in gigabytes.
      UPLOAD_MAX_GB: ${UPLOAD_MAX_GB:-20}
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/andreferrazz/video-streaming-service-worker:${IMAGE_TAG:-main}
    pull_policy: always
    deploy:
      # Workers share the queue safely, so more than one can run. Each takes
      # up to the CPU and memory below. Encoding every quality in one ffmpeg
      # run peaked at about 1.7 GB with a 4K source, file cache included.
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    restart: unless-stopped
    environment:
      <<: *app-env
      # Seconds a worker's claim on a video lasts without being renewed. If a
      # worker dies, another takes its video over after this long.
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      # A video that has taken its worker down this many times is given up on.
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  garage-meta:
  garage-data:
